name: Diagnosticar campo tipo no feed WhatJobs

on:
  push:
    branches:
      - main
    paths:
      - 'diagnosticar_tipo_feed.py'
      - '.github/workflows/diagnosticar-tipo-feed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ler XML e contar campos tipo
        run: python diagnosticar_tipo_feed.py
